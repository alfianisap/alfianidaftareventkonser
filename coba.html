<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="sapa">Halo!</p>
    <script>
        const p = new URLSearchParams(location.search);
        const nama = p.get("nama") || "Tamu";

        document.querySelector("#sapa").textContent = `Halo ${nama}`;
    </script>
</body>
</html>
